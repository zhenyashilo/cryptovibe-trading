<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoVibe - Вход</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a0a12 0%, #12121e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 400px; width: 100%; padding: 2rem; }
    .card {
      background: rgba(25, 25, 45, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 2rem;
      backdrop-filter: blur(12px);
    }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.75rem; }
    h1 span { color: #00f3ff; }
    .subtitle { text-align: center; color: #a0a0b0; margin-bottom: 2rem; font-size: 0.9rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; color: #a0a0b0; margin-bottom: 0.4rem; font-weight: 500; }
    input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0.75rem;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #00f3ff; }
    .btn {
      width: 100%;
      background: #00f3ff;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0.85rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 1rem;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .error {
      background: rgba(255, 0, 85, 0.15);
      border: 1px solid rgba(255, 0, 85, 0.3);
      color: #ff0055;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      display: none;
    }
    .success {
      background: rgba(0, 255, 157, 0.15);
      border: 1px solid rgba(0, 255, 157, 0.3);
      color: #00ff9d;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      display: none;
    }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .tab {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0.6rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: rgba(0, 243, 255, 0.15);
      border-color: #00f3ff;
      color: #00f3ff;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Crypto<span>Vibe</span></h1>
      <p class="subtitle">Журнал трейдера с синхронизацией</p>
      <div class="error" id="error-msg"></div>
      <div class="success" id="success-msg"></div>
      <div class="tabs">
        <div class="tab active" data-tab="login">Вход</div>
        <div class="tab" data-tab="register">Регистрация</div>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">Войти</button>
      </form>
      <form id="register-form" class="hidden">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="register-email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>Пароль (минимум 6 символов)</label>
          <input type="password" id="register-password" required placeholder="••••••••" minlength="6">
        </div>
        <button type="submit" class="btn">Зарегистрироваться</button>
      </form>
      <button class="btn btn-secondary" id="continue-guest">Продолжить без регистрации (локально)</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBYP0lCrTJzeh_7ERYdqGVwAfpkkOiff24",
      authDomain: "cryptovibe-trading.firebaseapp.com",
      projectId: "cryptovibe-trading",
      storageBucket: "cryptovibe-trading.firebasestorage.app",
      messagingSenderId: "415915114461",
      appId: "1:415915114461:web:a327dae9ee8da240bb8034",
      measurementId: "G-CSS9SGCJ2V"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        if (tab.dataset.tab === 'login') {
          document.getElementById('login-form').classList.remove('hidden');
          document.getElementById('register-form').classList.add('hidden');
        } else {
          document.getElementById('login-form').classList.add('hidden');
          document.getElementById('register-form').classList.remove('hidden');
        }
        hideMessages();
      });
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById('login-email').value,
          document.getElementById('login-password').value
        );
        window.location.href = 'trading.html';
      } catch (err) {
        showError(err.message);
      }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      try {
        await auth.createUserWithEmailAndPassword(
          document.getElementById('register-email').value,
          document.getElementById('register-password').value
        );
        showSuccess('Регистрация успешна!');
        setTimeout(() => window.location.href = 'trading.html', 1000);
      } catch (err) {
        showError(err.message);
      }
    });

    document.getElementById('continue-guest').addEventListener('click', () => {
      localStorage.setItem('guest_mode', 'true');
      window.location.href = 'trading.html';
    });

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = '❌ ' + msg;
      el.style.display = 'block';
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.textContent = '✅ ' + msg;
      el.style.display = 'block';
    }

    function hideMessages() {
      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('success-msg').style.display = 'none';
    }

    auth.onAuthStateChanged((user) => {
      if (user && !localStorage.getItem('guest_mode')) {
        window.location.href = 'trading.html';
      }
    });
  </script>
</body>
</html>
