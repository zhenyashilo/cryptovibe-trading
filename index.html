<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a12">
  <title>CryptoVibe Analytics</title>
  <link rel="manifest" href="site.webmanifest">
  <style>
    :root {
      --bg-primary: #0a0a12;
      --bg-secondary: #12121f;
      --bg-input: #1a1a2e;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --glass-border: rgba(255,255,255,0.08);
      --neon-cyan: #00f3ff;
      --neon-green: #00ff9d;
      --neon-red: #ff0055;
      --neon-yellow: #ffe600;
      --neon-purple: #a855f7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: rgba(10,10,18,0.95); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1rem; z-index: 1000;
    }
    .logo { font-size: 1.3rem; font-weight: 700; }
    .logo span { color: var(--neon-cyan); }
    .nav-links { display: flex; gap: 0.5rem; overflow-x: auto; }
    .nav-links a {
      color: var(--text-secondary); text-decoration: none;
      font-size: 0.85rem; padding: 0.5rem 0.75rem; border-radius: 8px;
      white-space: nowrap; transition: all 0.2s;
    }
    .nav-links a.active { color: var(--neon-cyan); background: rgba(0,243,255,0.1); }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
      background: rgba(10,10,18,0.95); backdrop-filter: blur(10px);
      border-top: 1px solid var(--glass-border);
      display: flex; justify-content: space-around; align-items: center;
      z-index: 1000;
    }
    .bottom-nav a {
      color: var(--text-secondary); text-decoration: none;
      font-size: 0.7rem; display: flex; flex-direction: column;
      align-items: center; gap: 0.25rem; padding: 0.5rem;
    }
    .bottom-nav a.active { color: var(--neon-cyan); }
    .bottom-nav a .icon { font-size: 1.3rem; }
    #main-content { padding: 70px 1rem 1rem; }
    .page-header { margin-bottom: 1.5rem; }
    .page-header h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .page-header p { color: var(--text-secondary); font-size: 0.9rem; }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem; margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--bg-secondary); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 1rem;
    }
    .stat-card h3 { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .metric-value { font-size: 1.3rem; font-weight: 700; }
    .metric-value.positive { color: var(--neon-green); }
    .metric-value.negative { color: var(--neon-red); }
    .metric-sub { font-size: 0.75rem; color: var(--text-secondary); }
    .section { margin-bottom: 1.5rem; }
    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem;
    }
    .section-header h2 { font-size: 1.1rem; }
    .btn {
      background: var(--neon-cyan); color: #000; border: none;
      padding: 0.6rem 1rem; border-radius: 8px; font-weight: 600;
      cursor: pointer; font-size: 0.9rem;
    }
    .btn-secondary { background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--glass-border); }
    .btn-danger { background: var(--neon-red); color: #fff; }
    .token-list { display: grid; gap: 0.75rem; }
    .token-item {
      background: var(--bg-secondary); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 1rem; text-decoration: none;
      color: var(--text-primary); display: flex; justify-content: space-between;
      align-items: center; transition: all 0.2s;
    }
    .token-item:active { background: var(--bg-input); }
    .token-info { display: flex; align-items: center; gap: 0.75rem; flex: 1; }
    .token-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.9rem;
    }
    .token-name { font-weight: 600; font-size: 1rem; }
    .token-sub { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem; }
    .token-stats { text-align: right; }
    .token-value { font-weight: 700; font-size: 1rem; }
    .token-profit { font-size: 0.85rem; margin-top: 0.25rem; }
    .token-profit.pos { color: var(--neon-green); }
    .token-profit.neg { color: var(--neon-red); }
    .tx-list { display: grid; gap: 0.75rem; }
    .tx-item {
      background: var(--bg-secondary); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 1rem; display: flex;
      justify-content: space-between; align-items: center;
    }
    .tx-info h4 { font-size: 0.95rem; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
    .tx-badge {
      font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 4px;
      font-weight: 600;
    }
    .badge-trade { background: rgba(0,243,255,0.15); color: var(--neon-cyan); }
    .badge-bot-payout { background: rgba(0,255,157,0.15); color: var(--neon-green); }
    .badge-earning { background: rgba(168,85,247,0.15); color: var(--neon-purple); }
    .badge-ad { background: rgba(255,230,0,0.15); color: var(--neon-yellow); }
    .badge-deposit { background: rgba(0,255,157,0.15); color: var(--neon-green); }
    .badge-custom { background: rgba(255,255,255,0.1); color: var(--text-secondary); }
    .tx-meta { font-size: 0.8rem; color: var(--text-secondary); }
    .tx-amount { font-weight: 700; font-size: 1rem; }
    .tx-amount.pos { color: var(--neon-green); }
    .tx-amount.neg { color: var(--neon-red); }
    .tx-amount.neutral { color: var(--text-primary); }
    .tx-actions { display: flex; gap: 0.5rem; }
    .tx-action-btn {
      background: var(--bg-input); border: 1px solid var(--glass-border);
      border-radius: 6px; padding: 0.4rem 0.6rem; cursor: pointer;
      color: var(--text-secondary); font-size: 0.9rem;
    }
    .tx-status { font-size: 0.7rem; padding: 0.15rem 0.4rem; border-radius: 4px; }
    .tx-status.open { background: rgba(255,230,0,0.15); color: var(--neon-yellow); }
    .tx-status.closed { background: rgba(0,255,157,0.15); color: var(--neon-green); }
    .tx-current-price { font-size: 0.75rem; color: var(--neon-cyan); margin-top: 0.25rem; }
    .period-filter { display: flex; gap: 0.5rem; margin-bottom: 1rem; overflow-x: auto; }
    .period-btn {
      background: var(--bg-input); border: 1px solid var(--glass-border);
      color: var(--text-secondary); padding: 0.5rem 1rem; border-radius: 20px;
      cursor: pointer; font-size: 0.85rem; white-space: nowrap;
    }
    .period-btn.active { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); }
    .search-box { margin-bottom: 1rem; }
    .search-box input {
      width: 100%; background: var(--bg-input); border: 1px solid var(--glass-border);
      color: var(--text-primary); padding: 0.75rem 1rem; border-radius: 8px;
      font-size: 0.95rem;
    }
    .empty-state { text-align: center; padding: 2rem; color: var(--text-secondary); }
    .back-btn {
      background: none; border: none; color: var(--neon-cyan);
      font-size: 1rem; cursor: pointer; margin-bottom: 1rem; padding: 0.5rem 0;
    }
    .token-detail-header {
      display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;
    }
    .token-detail-header .token-icon { width: 60px; height: 60px; font-size: 1.2rem; }
    .detail-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem; margin-bottom: 1.5rem;
    }
    .detail-card {
      background: var(--bg-secondary); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 1rem;
    }
    .detail-card label { font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 0.5rem; }
    .detail-card .value { font-size: 1.1rem; font-weight: 700; }
    .detail-card .value.positive { color: var(--neon-green); }
    .detail-card .value.negative { color: var(--neon-red); }
    .add-fab {
      position: fixed; bottom: 90px; right: 20px; width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      border: none; border-radius: 50%; color: #fff; font-size: 1.5rem;
      cursor: pointer; box-shadow: 0 4px 20px rgba(0,243,255,0.4); z-index: 999;
    }
    dialog {
      background: var(--bg-secondary); color: var(--text-primary);
      border: 1px solid var(--glass-border); border-radius: 16px;
      padding: 0; max-width: 90vw; width: 500px;
    }
    dialog::backdrop { background: rgba(0,0,0,0.7); }
    .modal-header {
      padding: 1.25rem; border-bottom: 1px solid var(--glass-border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h2 { font-size: 1.25rem; }
    .close-btn { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; }
    .modal-body { padding: 1.25rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem; }
    .form-group { margin-bottom: 0.75rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .form-input {
      width: 100%; background: var(--bg-input); border: 1px solid var(--glass-border);
      color: var(--text-primary); padding: 0.75rem; border-radius: 8px; font-size: 0.95rem;
    }
    .submit-btn {
      width: 100%; background: var(--neon-cyan); color: #000; border: none;
      padding: 0.85rem; border-radius: 8px; font-weight: 600; cursor: pointer;
      font-size: 1rem; margin-top: 1rem;
    }
    .submit-btn.secondary { background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--glass-border); }
    .custom-select { position: relative; }
    .custom-select-trigger {
      background: var(--bg-input); border: 1px solid var(--glass-border);
      color: var(--text-primary); padding: 0.75rem; border-radius: 8px;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .custom-select-list {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--bg-secondary); border: 1px solid var(--glass-border);
      border-radius: 8px; max-height: 200px; overflow-y: auto;
      z-index: 100; display: none; margin-top: 0.25rem;
    }
    .custom-select-list.open { display: block; }
    .custom-select-option {
      padding: 0.75rem; cursor: pointer; transition: background 0.15s;
    }
    .custom-select-option:hover, .custom-select-option.selected {
      background: rgba(0,243,255,0.1); color: var(--neon-cyan);
    }
    .autocomplete-suggestions {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--bg-secondary); border: 1px solid var(--glass-border);
      border-radius: 8px; max-height: 250px; overflow-y: auto;
      z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.4); display: none;
    }
    .autocomplete-item {
      padding: 0.75rem; cursor: pointer; transition: background 0.15s; font-size: 0.95rem;
    }
    .autocomplete-item:hover { background: rgba(0,243,255,0.15); color: var(--neon-cyan); }
    .type-list { display: grid; gap: 0.5rem; margin-top: 0.75rem; }
    .type-item {
      background: var(--bg-input); border: 1px solid var(--glass-border);
      border-radius: 8px; padding: 0.75rem; display: flex;
      justify-content: space-between; align-items: center;
    }
    .type-item-info { display: flex; flex-direction: column; gap: 0.25rem; }
    .type-item-key { font-size: 0.75rem; color: var(--neon-cyan); font-family: monospace; }
    .type-item-actions { display: flex; gap: 0.5rem; }
    .add-type-form { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--glass-border); }
    .add-type-form h3 { font-size: 0.95rem; margin-bottom: 0.75rem; }
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .detail-grid { grid-template-columns: repeat(2, 1fr); }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="logo">Crypto<span>Vibe</span></div>
    <div class="nav-links">
      <a href="#/portfolio" data-route="portfolio">Портфель</a>
      <a href="#/tokens" data-route="tokens">Токены</a>
      <a href="#/trading" data-route="trading">Трейдинг</a>
      <a href="#/ston-tokens" data-route="ston-tokens">STON</a>
      <a href="bots.html">Боты</a>
      <a href="trading.html">Журнал</a>
      <a href="#/settings" data-route="settings">⚙️</a>
    </div>
  </nav>

  <main id="main-content"></main>

  <button class="add-fab" id="open-modal-btn">+</button>

  <dialog id="tx-modal">
    <div class="modal-header">
      <h2 id="modal-title">Новая операция</h2>
      <button class="close-btn" id="close-modal-btn">&times;</button>
    </div>
    <form id="tx-form" class="modal-body">
      <input type="hidden" name="type" value="buy">
      <div class="form-group">
        <label>Тип операции</label>
        <div class="custom-select" data-select="type">
          <div class="custom-select-trigger">
            <span class="selected-text">Загрузка...</span>
            <span>▼</span>
          </div>
          <div class="custom-select-list"></div>
        </div>
      </div>
      <div class="form-group">
        <label>Название проекта / Токена</label>
        <input type="text" name="name" id="tx-name" class="form-input" placeholder="BTC, ETH..." autocomplete="off">
      </div>
      <div id="token-fields" style="display:none;">
        <div class="form-row">
          <div class="form-group">
            <label id="hint-quantity">Количество токенов</label>
            <input type="number" name="quantity" id="tx-quantity" class="form-input" step="any" placeholder="0.00">
          </div>
          <div class="form-group">
            <label id="hint-usdt">Сумма в USDT</label>
            <input type="number" name="usdt" id="tx-usdt" class="form-input" step="any" placeholder="0.00">
          </div>
        </div>
      </div>
      <div id="finance-fields" style="display:none;">
        <div class="form-group">
          <label>Сумма в USDT</label>
          <input type="number" name="financeUsdt" id="tx-finance-usdt" class="form-input" step="any" placeholder="0.00">
        </div>
      </div>
      <div id="earning-bot-fields" style="display:none;">
        <div class="form-row">
          <div class="form-group">
            <label id="hint-earning-bot-amount">Сколько пополнили</label>
            <input type="number" name="earningBotAmount" id="tx-earning-bot-amount" class="form-input" step="any" placeholder="0.00">
          </div>
          <div class="form-group">
            <label>Валюта</label>
            <div class="custom-select" data-select="earningBotCurrency">
              <div class="custom-select-trigger">
                <span class="selected-text">USDT</span>
                <span>▼</span>
              </div>
              <div class="custom-select-list">
                <div class="custom-select-option" data-value="USDT"><span>USDT</span></div>
                <div class="custom-select-option" data-value="GRAM"><span>GRAM</span></div>
              </div>
              <input type="hidden" name="earningBotCurrency" value="USDT">
            </div>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Дата</label>
          <input type="date" name="date" id="tx-date" class="form-input" required>
        </div>
        <div class="form-group">
          <label>Время (необязательно)</label>
          <input type="time" name="time" id="tx-time" class="form-input">
        </div>
      </div>
      <div class="form-group">
        <label>Заметки (необязательно)</label>
        <textarea name="notes" id="tx-notes" class="form-input" rows="2"></textarea>
      </div>
      <button type="submit" class="submit-btn">Сохранить операцию</button>
    </form>
  </dialog>

  <nav class="bottom-nav">
    <a href="#/portfolio" data-route="portfolio"><span class="icon">📊</span>Портфель</a>
    <a href="#/tokens" data-route="tokens"><span class="icon">🪙</span>Токены</a>
    <a href="#/trading" data-route="trading"><span class="icon">📈</span>Трейдинг</a>
    <a href="#/ston-tokens" data-route="ston-tokens"><span class="icon">💎</span>STON</a>
    <a href="#/settings" data-route="settings"><span class="icon">⚙️</span>Ещё</a>
  </nav>

  <!-- Firebase SDK (ОБЯЗАТЕЛЬНО перед firebase-client.js) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <!-- Firebase клиент -->
  <script src="js/firebase-client.js"></script>
  
  <!-- Токены STON.fi -->
  <script src="js/tokens-registry.js"></script>
  <script src="js/ston-api.js"></script>
  <script src="js/ston-page.js"></script>
  
  <!-- Остальные скрипты -->
  <script src="js/db.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/alerts-ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
